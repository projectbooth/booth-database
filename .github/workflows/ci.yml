name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests on every push and PR.
# Branch protection on main requires every job here to pass before merge. No coverage threshold.
#
# The provisioning and client end-to-end tests run against a REAL PostgreSQL (hack/docker-compose.yml),
# not a mock: workspace isolation and credential expiry are security properties the brief asks to be
# proven against a real server. BOOTH_TEST_REQUIRE_POSTGRES / BOOTH_TEST_REQUIRE_HELM make a missing
# dependency fail the build instead of skipping green.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4 # test/contract renders the chart
      - name: Verify gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then echo "Not gofmt-formatted:"; echo "$fmt_out"; exit 1; fi
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - name: Start PostgreSQL
        run: docker compose -f hack/docker-compose.yml up -d --wait
      - name: Unit + contract tests (against real PostgreSQL)
        env:
          BOOTH_TEST_REQUIRE_POSTGRES: "1"
          BOOTH_TEST_REQUIRE_HELM: "1"
        run: |
          eval "$(sh hack/test-env.sh)"
          go test -race -count=1 ./...
      - name: Backup script against real PostgreSQL
        run: |
          docker compose -f hack/docker-compose.yml cp charts/booth-database/files/backup.sh postgres:/tmp/backup.sh
          docker compose -f hack/docker-compose.yml exec -T -u postgres \
            -e PGHOST=/var/run/postgresql -e PGUSER=booth_admin -e BACKUP_DIR=/tmp/backups -e RETENTION_DAYS=7 \
            postgres sh /tmp/backup.sh
          docker compose -f hack/docker-compose.yml exec -T postgres sh -c \
            'ls /tmp/backups/2*/globals.sql && ! grep -q "PASSWORD .SCRAM" /tmp/backups/2*/globals.sql'
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose -f hack/docker-compose.yml logs --tail=100

  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # the end-to-end test builds and runs the real provider
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: client/pyproject.toml
      - run: pip install -e ".[dev,sqlalchemy]"
      - run: ruff check src tests
      - name: Start PostgreSQL
        working-directory: .
        run: docker compose -f hack/docker-compose.yml up -d --wait
      - name: Unit + end-to-end tests
        env:
          BOOTH_TEST_REQUIRE_POSTGRES: "1"
        run: |
          eval "$(sh ../hack/test-env.sh)"
          pytest -q

  web:
    # @projectbooth/database-ui (ADR 0093): the admin view's native UI package.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/booth-database
      - run: |
          helm lint charts/booth-database --set mode=external \
            --set external.host=pg.example --set external.username=admin --set external.passwordSecret.name=pg-admin

  image:
    # Catches a broken Dockerfile on the PR that breaks it. Not pushed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t booth-database:ci .
