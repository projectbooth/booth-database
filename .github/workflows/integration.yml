name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): the real chart on a real (kind) cluster — module,
# bundled PostgreSQL, backup CronJob — with an in-cluster Job exercising the client -> broker ->
# provider -> PostgreSQL path over cluster DNS. On merge to main and nightly, not every push. Exactly
# what stands in for booth-core, and why: hack/kind-integration.sh's header. Run locally before this
# workflow was written (2026-09-29), all checks passing; this workflow file itself has not run on
# GitHub yet.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
      - run: bash hack/kind-integration.sh
