{{- include "booth-database.validateMode" . -}}
# Registers booth-database with booth-core's module registry (ADR 0019, contracts/module-manifest.md).
#
# One native view (ADR 0093): a read-only status page under Manage — the active workspace's own
# database (owners only), plus a cross-workspace listing for owners of an operator workspace
# (docs/decisions/0004). A single view, deliberately no adminNavPath: there is no separate
# non-admin browsing experience. UI package: @projectbooth/database-ui (web/). Workspace data
# itself is still used through the client library, never through this view.
#
# Deliberately NO `database:` field: that asks booth-core to provision a module-internal database
# on core's own Postgres (ADR 0053), which this module neither needs nor should use (ADR 0081).
apiVersion: booth.projectbooth.io/v1alpha1
kind: BoothModule
metadata:
  name: database
  labels:
    {{- include "booth-database.labels" . | nindent 4 }}
spec:
  id: database
  displayName: Database
  icon: database
  version: {{ .Chart.AppVersion | quote }}
  contractVersion: "0.1.0"
  hasOwnUi: true
  uiIntegrationMode: native
  navGroup: manage
  navPath: /database
  healthCheckPath: /healthz
  {{- if .Values.credentialBroker.enabled }}
  # ADR 0080/0088: this module mints short-lived `postgres` credentials for the credential
  # broker. Declaring this is what makes core deliver the
  # booth-credential-broker-provider-credentials Secret and route postgres requests here.
  providesCredentials:
    kinds:
      - postgres
  {{- end }}
  serviceRef:
    name: {{ include "booth-database.fullname" . }}
    port: {{ .Values.service.port }}
