{{- if .Values.serviceAccount.create }}
# The module never calls the Kubernetes API (unlike booth-storage it stores no Secrets of its
# own), so the token is not mounted at all; see deployment.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booth-database.serviceAccountName" . }}
  labels:
    {{- include "booth-database.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
