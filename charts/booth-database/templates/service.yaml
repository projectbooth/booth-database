apiVersion: v1
kind: Service
metadata:
  name: {{ include "booth-database.fullname" . }}
  labels:
    {{- include "booth-database.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "booth-database.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
